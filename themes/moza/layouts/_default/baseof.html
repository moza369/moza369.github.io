<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="light">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{- partial "header.html" . -}}

  <main class="site-main">
    {{- block "main" . }}{{- end }}
  </main>

  {{- partial "footer.html" . -}}

  <!-- Search Overlay -->
  <div class="search-overlay" id="search-overlay">
    <div class="search-modal">
      <div class="search-header">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search articles..." autocomplete="off">
        <button class="search-close" id="search-close" aria-label="Close search">&times;</button>
      </div>
      <div class="search-results" id="search-results">
        <p class="search-placeholder">Type to search...</p>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobile-menu">
    <nav>
      <ul class="mobile-nav-links">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" class="mobile-nav-link">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>

  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
